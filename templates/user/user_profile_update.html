{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  {% load static %}
  <div class="d-flex" style="min-height:100vh; background-color:#f8f9fa;">

    {% include "includes/profile_sidebar.html" %}

    <div class="flex-grow-1 p-4" style="margin-right: 100px">

      <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
          <a class="nav-link nav-text-black active" href="{% url 'user:profile' %}">Account</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-text-black" href="{% url 'user:profile-tickets' %}">Tickets</a>
        </li>
        {% if user.band %}
          <li class="nav-item">
          <a class="nav-link nav-text-black" href="{% url 'user:profile-band' %}">Band</a>
          </li>
        {% endif %}
      </ul>

      <div class="bg-white p-4 rounded shadow-sm">
        <form action="" method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <input class="btn btn-ticket" type="submit" value="Update">
        </form>
      </div>

    </div>
  </div>
{% endblock %}
