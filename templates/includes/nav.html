{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'booker:index' %}">
      <img src="{% static 'logoo.png' %}" alt="Logo" class="logo-img">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link nav-text" href="{% url 'booker:event-list' %}">Events</a></li>
        <li class="nav-item"><a class="nav-link nav-text" href="{% url 'booker:tour-list' %}">Tours</a></li>
        <li class="nav-item"><a class="nav-link nav-text" href="{% url 'booker:band-list' %}">Artists</a></li>
      </ul>

      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle nav-text" href="#" id="profileDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i> {{ user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
            <li><a class="dropdown-item" href="{% url 'user:profile' %}">Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form action="{% url 'user:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">Logout</button>
              </form>
            </li>
          </ul>
        </li>
        {% else %}
        <li class="nav-item"><a class="nav-link nav-text" href="{% url 'login' %}">Login</a></li>
        <li class="nav-item"><a class="nav-link nav-text" href="{% url 'user:register' %}">Sign up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
