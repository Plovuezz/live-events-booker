<div class="d-flex flex-column align-items-center p-3 bg-white shadow-sm" style="width:250px;">
  <i class="bi bi-person-circle" style="font-size:5rem; color:#6c757d;"></i>
  <h4 class="mt-2">{{ user.username|upper }}</h4>
  <p class="text-muted mb-1">ID: {{ user.id }}</p>
  <p class="mb-1">{{ user.first_name }} {{ user.last_name }}</p>
  <p class="text-muted">{{ user.email }}</p>
  <a href="{% url 'user:logout' %}" class="btn btn-ticket">Logout</a>
</div>
